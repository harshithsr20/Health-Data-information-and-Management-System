<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/admin_log.css">
    <title>Admin Login</title>
    <style>
        #error-box {
            display: none;
            background: rgba(186, 26, 26, 0.1);
            border: 1.5px solid rgba(186, 26, 26, 0.3);
            color: #ba1a1a;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            margin-bottom: 15px;
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }
    </style>
</head>

<body>

    <div class="log-in-card">
        <h1>Admin Log in</h1>
        <div id="error-box"></div>
        <label for="id-holder">Admin ID</label>
        <input type="text" placeholder="000-0010-000001" id="id-holder">
        <label for="password">password</label>
        <input type="password" id="admin-password">
        <button id="submit-but">Submit</button>

    </div>
    <script type="module" src="./JS files/admin_login.js"></script>
</body>

</html>
