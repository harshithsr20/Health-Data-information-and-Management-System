<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — HDIMS Admin</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --red-deep: #c0152a;
            --red-mid: #e63950;
            --red-light: #ff8fa3;
            --glass-bg: rgba(255, 255, 255, 0.18);
            --glass-border: rgba(255, 255, 255, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff 0%, #ffe0e6 50%, #c0152a 100%);
            font-family: 'Roboto', sans-serif;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 36px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 40px rgba(192, 21, 42, 0.18), 0 2px 8px rgba(192, 21, 42, 0.08);
            animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(16px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff8fa3, #c0152a, #7a0a1a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.82rem;
            color: rgba(122, 10, 26, 0.6);
            margin-bottom: 24px;
            font-weight: 400;
        }

        /* Error & success boxes */
        #error-box,
        #success-box {
            display: none;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            margin-bottom: 16px;
        }

        #error-box {
            background: rgba(186, 26, 26, 0.1);
            border: 1.5px solid rgba(186, 26, 26, 0.3);
            color: #ba1a1a;
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        #success-box {
            background: rgba(21, 128, 61, 0.1);
            border: 1.5px solid rgba(21, 128, 61, 0.3);
            color: #15803d;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            color: rgba(122, 10, 26, 0.75);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(255, 255, 255, 0.55);
            border: 1.5px solid rgba(192, 21, 42, 0.2);
            border-radius: 14px;
            font-size: 0.9rem;
            font-family: 'Roboto', sans-serif;
            color: #3a0a12;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: rgba(192, 21, 42, 0.3);
        }

        input:focus {
            border-color: var(--red-mid);
            box-shadow: 0 0 0 3px rgba(230, 57, 80, 0.12);
        }

        /* Password strength bar */
        .strength-bar-wrap {
            margin-top: -10px;
            margin-bottom: 16px;
        }

        .strength-bar-track {
            height: 4px;
            background: rgba(192, 21, 42, 0.1);
            border-radius: 99px;
            overflow: hidden;
        }

        .strength-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 99px;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .strength-label {
            font-size: 0.72rem;
            color: rgba(122, 10, 26, 0.5);
            margin-top: 4px;
            font-weight: 500;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--red-mid), var(--red-deep));
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.03em;
            box-shadow: 0 4px 16px rgba(192, 21, 42, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s;
            margin-top: 4px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(192, 21, 42, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 0.82rem;
            color: rgba(192, 21, 42, 0.65);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--red-deep);
            text-decoration: underline;
        }

        /* Re-auth note */
        .note {
            font-size: 0.75rem;
            color: rgba(122, 10, 26, 0.5);
            background: rgba(255, 143, 163, 0.12);
            border-radius: 10px;
            padding: 9px 12px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .note strong {
            color: var(--red-deep);
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Change Password</h1>
        <p class="subtitle">HDIMS Admin Portal</p>

        <div id="error-box"></div>
        <div id="success-box"></div>

        <p class="note">
            <strong>Re-authentication required.</strong> Enter your Admin ID and current password, then set a new one.
        </p>

        <label for="id-holder">Admin ID</label>
        <input type="text" placeholder="000-0010-000001" id="id-holder">

        <label for="current-password">Current Password</label>
        <input type="password" id="current-password" placeholder="Enter current password">

        <label for="new-password">New Password</label>
        <input type="password" id="new-password" placeholder="Min. 6 characters">

        <div class="strength-bar-wrap">
            <div class="strength-bar-track">
                <div class="strength-bar-fill" id="strength-fill"></div>
            </div>
            <div class="strength-label" id="strength-label"></div>
        </div>

        <label for="confirm-password">Confirm New Password</label>
        <input type="password" id="confirm-password" placeholder="Re-enter new password">

        <button id="submit-btn">Update Password</button>
        <a href="admin_log.html" class="back-link">← Back to Login</a>
    </div>

    <script type="module" src="./scripts/change_password.js"></script>
</body>

</html>
